name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ext: ''
            archive_ext: tar.gz
          - os: ubuntu-latest
            ext: ''
            archive_ext: tar.gz
          - os: windows-latest
            ext: .exe
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build (POSIX)
        if: matrix.os != 'windows-latest'
        run: |
          python -m nuitka \
            --standalone \
            --disable-ccache \
            --jobs=$(nproc 2>/dev/null || echo 2) \
            --output-filename=zentao-cli \
            zentao_api/cli.py
          # Tar up the standalone directory for distribution
          cd cli.dist
          tar czf ../zentao-cli-${{ runner.os }}-${{ runner.arch }}.tar.gz zentao-cli
          cd ..
          ls -la zentao-cli-${{ runner.os }}-${{ runner.arch }}.tar.gz

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --disable-ccache `
            --output-filename=zentao-cli `
            zentao_api/cli.py
          # Zip up the standalone directory
          Compress-Archive -Path cli.dist/zentao-cli `
            -DestinationPath zentao-cli-windows-x86_64.zip `
            -Force
          Get-Item zentao-cli-windows-x86_64.zip

      - name: Smoke test (POSIX)
        if: matrix.os != 'windows-latest'
        run: |
          ./cli.dist/zentao-cli --help
          echo "---"
          ./cli.dist/zentao-cli 2>&1 | head -5 || true

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          .\cli.dist\zentao-cli.exe --help
          Write-Host "---"
          .\cli.dist\zentao-cli.exe 2>&1 | Select-Object -First 5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zentao-cli-${{ runner.os }}-${{ runner.arch }}.${{ matrix.archive_ext }}
          path: zentao-cli-${{ runner.os }}-${{ runner.arch }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Attach binaries to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true