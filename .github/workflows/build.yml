name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ext: ''
            archive_ext: tar.gz
          - os: ubuntu-latest
            ext: ''
            archive_ext: tar.gz
          - os: windows-latest
            ext: .exe
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build (POSIX)
        if: matrix.os != 'windows-latest'
        run: |
          python -m nuitka \
            --standalone \
            --disable-ccache \
            --jobs=$(nproc 2>/dev/null || echo 2) \
            --output-filename=zentao-cli \
            zentao_api/cli.py
          # Package the whole cli.dist/ — the binary needs Python framework
          # and .so siblings alongside it. Use rsync for a clean recursive copy.
          rm -rf staging
          mkdir staging
          rsync -a cli.dist/ staging/zentao-cli/
          ls staging/zentao-cli/ | head -5
          echo "---"
          tar czf zentao-cli-${{ runner.os }}-${{ runner.arch }}.tar.gz -C staging zentao-cli
          ls -la zentao-cli-${{ runner.os }}-${{ runner.arch }}.tar.gz

      - name: Install MSVC build tools (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        # GitHub windows-latest has VS Enterprise but NOT the C++ build tools
        # workload. Install just the C++ compiler (cl.exe) and Windows SDK.
        # ~5 min download. Subsequent steps share the same shell via PATH.
        run: |
          choco install -y visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --add Microsoft.VisualStudio.Component.Windows11SDK.22621" --no-progress
          # Verify cl.exe is reachable after install.
          $cl = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x64 '&&' where cl.exe 2>&1
          Write-Host "cl.exe discovery: $cl"

      - name: Setup MSVC env (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== cl.exe (MSVC) availability: ==="
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) { Write-Host "found: $($cl.Source)" } else { Write-Host "MISSING" }
          Write-Host "=== Running build ==="
          python -m nuitka --standalone --disable-ccache --output-filename=zentao-cli zentao_api/cli.py 2>&1 | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD FAILED ==="
            exit 1
          }
          Write-Host "=== Build OK. cli.dist contents: ==="
          Get-ChildItem cli.dist | Select-Object -First 10
          Remove-Item -Recurse -Force staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path staging | Out-Null
          New-Item -ItemType Directory -Path staging/zentao-cli | Out-Null
          Copy-Item -Recurse -Force cli.dist/* staging/zentao-cli/
          Compress-Archive -Path staging/zentao-cli -DestinationPath zentao-cli-windows-x86_64.zip -Force
          Get-Item zentao-cli-windows-x86_64.zip

      - name: Smoke test (POSIX)
        if: matrix.os != 'windows-latest'
        continue-on-error: true
        run: |
          ./staging/zentao-cli/zentao-cli --help
          echo "---"
          ./staging/zentao-cli/zentao-cli 2>&1 | head -5 || true

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Listing staging dir:"
          Get-ChildItem staging
          Write-Host "---"
          Get-ChildItem staging/zentao-cli
          Write-Host "---"
          .\staging\zentao-cli\zentao-cli.exe --help

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zentao-cli-${{ runner.os }}-${{ runner.arch }}.${{ matrix.archive_ext }}
          path: zentao-cli-${{ runner.os }}-${{ runner.arch }}.${{ matrix.archive_ext }}
          if-no-files-found: ignore

  release:
    name: Attach binaries to GitHub Release
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false