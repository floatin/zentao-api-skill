name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            ext: ''
            archive_ext: tar.gz
          - os: ubuntu-latest
            ext: ''
            archive_ext: tar.gz
          - os: windows-latest
            ext: .exe
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Build (POSIX)
        if: matrix.os != 'windows-latest'
        run: |
          python -m nuitka \
            --standalone \
            --disable-ccache \
            --jobs=$(nproc 2>/dev/null || echo 2) \
            --output-filename=zentao-cli \
            zentao_api/cli.py
          # Package the whole cli.dist/ — the binary needs Python framework
          # and .so siblings alongside it. Use rsync for a clean recursive copy.
          rm -rf staging
          mkdir staging
          rsync -a cli.dist/ staging/zentao-cli/
          ls staging/zentao-cli/ | head -5
          echo "---"
          tar czf zentao-cli-${{ runner.os }}-${{ runner.arch }}.tar.gz -C staging zentao-cli
          ls -la zentao-cli-${{ runner.os }}-${{ runner.arch }}.tar.gz

      - name: Install MinGW (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Download portable MinGW-w64 as a .zip (Expand-Archive friendly).
          # winlibs.com GCC 16.1, ~260 MB. Cached at $env:RUNNER_TEMP between steps.
          $mingwUrl = "https://github.com/brechtsanders/winlibs_mingw/releases/download/16.1.0posix-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.1.0-mingw-w64ucrt-14.0.0-r3.zip"
          $mingwDir = "C:\mingw64"
          $zipPath = "$env:RUNNER_TEMP\mingw.zip"
          if (-not (Test-Path $mingwDir)) {
            Write-Host "Downloading MinGW from $mingwUrl"
            # Use curl.exe (built into GitHub windows runners) — more reliable
            # than Invoke-WebRequest which sometimes has TLS issues.
            & curl.exe -L -s -o $zipPath $mingwUrl
            $sizeMb = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
            Write-Host "Downloaded $sizeMb MB"
            if ($sizeMb -lt 50) {
              Write-Host "FATAL: download too small, likely failed"
              exit 1
            }
            Write-Host "Extracting..."
            Expand-Archive -Path $zipPath -DestinationPath $mingwDir -Force
            # winlibs zip extracts into a subdirectory like "mingw64"
            $inner = Get-ChildItem $mingwDir -Directory | Select-Object -First 1
            if ($inner -and (Test-Path "$($inner.FullName)\bin\gcc.exe")) {
              Write-Host "Moving $($inner.Name) -> mingw64"
              Move-Item "$($inner.FullName)\*" $mingwDir -Force
              Remove-Item $inner.FullName -Recurse -Force
            }
            Remove-Item $zipPath
          }
          $gcc = Get-ChildItem "$mingwDir\bin\gcc.exe" -ErrorAction SilentlyContinue
          if (-not $gcc) {
            Get-ChildItem "$mingwDir" | Select-Object -First 10
            Write-Host "FATAL: gcc not found"
            exit 1
          }
          Write-Host "gcc found: $($gcc.FullName)"
          Write-Host "::add-path::$mingwDir\bin"

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "=== gcc availability: ==="
          $gcc = Get-Command gcc -ErrorAction SilentlyContinue
          if ($gcc) { Write-Host "found: $($gcc.Source)" } else { Write-Host "MISSING" }
          Write-Host "=== Running build with --show-scons-output ==="
          python -m nuitka --standalone --disable-ccache --mingw-mode --show-scons-output --output-filename=zentao-cli zentao_api/cli.py 2>&1 | Select-Object -Last 40
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== BUILD FAILED ==="
            exit 1
          }
          Write-Host "=== Build OK. cli.dist contents: ==="
          Get-ChildItem cli.dist | Select-Object -First 10
          Remove-Item -Recurse -Force staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path staging | Out-Null
          New-Item -ItemType Directory -Path staging/zentao-cli | Out-Null
          Copy-Item -Recurse -Force cli.dist/* staging/zentao-cli/
          Compress-Archive -Path staging/zentao-cli -DestinationPath zentao-cli-windows-x86_64.zip -Force
          Get-Item zentao-cli-windows-x86_64.zip

      - name: Smoke test (POSIX)
        if: matrix.os != 'windows-latest'
        continue-on-error: true
        run: |
          ./staging/zentao-cli/zentao-cli --help
          echo "---"
          ./staging/zentao-cli/zentao-cli 2>&1 | head -5 || true

      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: pwsh
        run: |
          Write-Host "Listing staging dir:"
          Get-ChildItem staging
          Write-Host "---"
          Get-ChildItem staging/zentao-cli
          Write-Host "---"
          .\staging\zentao-cli\zentao-cli.exe --help

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zentao-cli-${{ runner.os }}-${{ runner.arch }}.${{ matrix.archive_ext }}
          path: zentao-cli-${{ runner.os }}-${{ runner.arch }}.${{ matrix.archive_ext }}
          if-no-files-found: ignore

  release:
    name: Attach binaries to GitHub Release
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false