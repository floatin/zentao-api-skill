[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ys-zentao-api"
version = "0.2.4"
description = "禅道项目管理 API 客户端与命令行工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
zentao = "zentao_api.cli:main"

[tool.setuptools.packages.find]
include = ["zentao_api*"]
